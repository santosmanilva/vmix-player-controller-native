name: Build native Windows portable

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/build-native.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish native portable
        run: >-
          dotnet publish native/vMixPlayerController.csproj -c Release -r win-x64
          --source https://api.nuget.org/v3/index.json
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o native/publish
      - name: Publish lightweight portable
        run: >-
          dotnet publish native/vMixPlayerController.csproj -c Release -r win-x64
          --source https://api.nuget.org/v3/index.json
          --self-contained false -p:PublishSingleFile=true
          -p:DebugType=None -p:DebugSymbols=false
          -o native/publish-light
      - name: Run native self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $results = Join-Path $env:RUNNER_TEMP "vmix-test-results"
          New-Item -ItemType Directory -Force $results | Out-Null
          function Invoke-ControllerTest($exe, $name, $extraArgs) {
            $result = Join-Path $results "$name.txt"
            $argument = if ($name -eq "tools") { "--tools-smoke=$result" } else { "--self-test=$result" }
            $process = Start-Process $exe -ArgumentList (@($extraArgs) + ('"' + $argument + '"')) -PassThru
            if (-not $process.WaitForExit(60000)) {
              $process.Kill()
              throw "$name timed out after 60 seconds"
            }
            $process.Refresh()
            $text = if (Test-Path $result) { Get-Content $result -Raw } else { "No result file was produced" }
            Write-Host "$name (exit $($process.ExitCode)): $text"
            if ($process.ExitCode -ne 0 -or -not $text.StartsWith("PASS")) { throw "$name failed: $text" }
          }
          Invoke-ControllerTest "native/publish/vMix-Player-Controller.exe" "native" @()
          Invoke-ControllerTest "native/publish-light/vMix-Player-Controller.exe" "light" @()
          Invoke-ControllerTest "native/publish-light/vMix-Player-Controller.exe" "tools" @("--demo")
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: ${{ runner.temp }}/vmix-test-results/
          if-no-files-found: warn
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: vMix-Player-Controller-native
          path: native/publish/vMix-Player-Controller.exe
          if-no-files-found: error
      - name: Upload lightweight artifact
        uses: actions/upload-artifact@v4
        with:
          name: vMix-Player-Controller-light
          path: native/publish-light/vMix-Player-Controller.exe
          if-no-files-found: error
